# CD v3 - DEV auto-deploy + PROD approval-gated deploy (PROD stage enabled 2026-10-27).
# SIT stage remains present but DISABLED (ENABLE_SIT=false; SIT was skipped by decision -
# PROD depends on DEV directly so the enabled PROD stage is not blocked by the skipped SIT).
# PROD block is a mirror of DEV: own variable group (vg-prod), own VM_HOST (10.0.0.6),
# APP_ENV=PROD. Approval check lives on the demo-prod environment in Azure DevOps.

trigger: none

resources:
  pipelines:
    - pipeline: ci
      source: 'itmurugappan.azure-devops-springboot-demo'
      trigger:
        branches:
          include:
            - main

variables:
  ENABLE_SIT: 'false'   # SIT intentionally not built for this demo; stage stays defined but off
  ENABLE_PROD: 'true'   # PROD VM + kv-azdemo-prod + vg-prod are ready (2026-10-27)

stages:
  - stage: DeployDEV
    displayName: 'Deploy to DEV (automatic on CI completion)'
    jobs:
      - deployment: DeployDEVJob
        displayName: 'Deploy WAR to DEV Tomcat'
        environment: 'demo-dev'
        pool:
          name: DemoBuildPool
        variables:
          - group: vg-dev
          - name: VM_HOST
            value: '10.0.0.4'
          - name: APP_ENV_NAME
            value: 'DEV'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - download: ci
                  artifact: drop
                - task: ExtractFiles@1
                  displayName: 'Unzip CI artifact'
                  inputs:
                    archiveFilePatterns: '$(Pipeline.Workspace)/ci/drop/*.zip'
                    destinationFolder: '$(Pipeline.Workspace)/war'
                    cleanDestinationFolder: true
                - bash: |
                    set -e
                    ls -lh $(Pipeline.Workspace)/war
                    scp -o StrictHostKeyChecking=accept-new $(Pipeline.Workspace)/war/azure-demo.war scripts/deploy-war.sh azureuser@$(VM_HOST):/tmp/
                    ssh -o StrictHostKeyChecking=accept-new azureuser@$(VM_HOST) "sudo APP_ENV=$(APP_ENV_NAME) APP_VERSION=$(resources.pipeline.ci.runName) APP_API_KEY='$(app-api-key)' bash /tmp/deploy-war.sh /tmp/azure-demo.war"
                  displayName: 'Deploy WAR to DEV via SSH (private VNet IP)'

  - stage: DeploySIT
    displayName: 'Deploy to SIT (scheduled - disabled until SIT exists)'
    dependsOn: DeployDEV
    condition: and(succeeded(), eq(variables.ENABLE_SIT, 'true'))
    jobs:
      - deployment: DeploySITJob
        displayName: 'Deploy WAR to SIT Tomcat'
        environment: 'demo-sit'
        pool:
          name: DemoBuildPool
        strategy:
          runOnce:
            deploy:
              steps:
                - script: echo "SIT stage placeholder - replaced with DEV-mirror deploy steps when SIT is enabled"
                  displayName: 'SIT placeholder'

  - stage: DeployPROD
    displayName: 'Deploy to PROD (approval-gated on demo-prod environment)'
    dependsOn: DeployDEV
    condition: and(succeeded(), eq(variables.ENABLE_PROD, 'true'))
    jobs:
      - deployment: DeployPRODJob
        displayName: 'Deploy WAR to PROD Tomcat'
        environment: 'demo-prod'
        pool:
          name: DemoBuildPool
        variables:
          - group: vg-prod
          - name: VM_HOST
            value: '10.0.0.6'
          - name: APP_ENV_NAME
            value: 'PROD'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - download: ci
                  artifact: drop
                - task: ExtractFiles@1
                  displayName: 'Unzip CI artifact'
                  inputs:
                    archiveFilePatterns: '$(Pipeline.Workspace)/ci/drop/*.zip'
                    destinationFolder: '$(Pipeline.Workspace)/war'
                    cleanDestinationFolder: true
                - bash: |
                    set -e
                    ls -lh $(Pipeline.Workspace)/war
                    scp -o StrictHostKeyChecking=accept-new $(Pipeline.Workspace)/war/azure-demo.war scripts/deploy-war.sh azureuser@$(VM_HOST):/tmp/
                    ssh -o StrictHostKeyChecking=accept-new azureuser@$(VM_HOST) "sudo APP_ENV=$(APP_ENV_NAME) APP_VERSION=$(resources.pipeline.ci.runName) APP_API_KEY='$(app-api-key)' bash /tmp/deploy-war.sh /tmp/azure-demo.war"
                  displayName: 'Deploy WAR to PROD via SSH (private VNet IP)'
